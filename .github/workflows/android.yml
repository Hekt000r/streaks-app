name: Android checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npx expo install --check
      - run: npm run check
      - run: npm run test:ui
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew :streak-engine:testDebugUnitTest :app:assembleDebug --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m'
        working-directory: android
      - name: Enable KVM for repository instrumentation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: cd android && ./gradlew :streak-engine:connectedDebugAndroidTest --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m'
      - uses: actions/upload-artifact@v4
        with:
          name: streaks-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
